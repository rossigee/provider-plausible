name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  GO_VERSION: '1.26.6'
  REGISTRY_ORGS: ghcr.io/rossigee
  XPKG_REG_ORGS: ghcr.io/rossigee

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vendor Dependencies
        run: go mod vendor

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"


      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install Crossplane CLI
        run: |
          PLATFORM=$(go env GOOS)_$(go env GOARCH)
          mkdir -p .cache/tools/${PLATFORM}
          curl -sSL "https://github.com/crossplane/crossplane/releases/download/v2.3.2/crossplane-${PLATFORM}" -o .cache/tools/${PLATFORM}/crossplane-cli-v2.3.2
          chmod +x .cache/tools/${PLATFORM}/crossplane-cli-v2.3.2
          ln -sf .cache/tools/${PLATFORM}/crossplane-cli-v2.3.2 .cache/tools/${PLATFORM}/crossplane-cli


      - name: Build and Publish All Artifacts
        run: |
          set -e

          export VERSION="${{ steps.version.outputs.version }}"
          export BRANCH_NAME="master"

          make publish \
            REGISTRY_ORGS="${REGISTRY_ORGS}" \
            XPKG_REG_ORGS="${XPKG_REG_ORGS}" \
            BRANCH_NAME=master

          echo "✅ Published to ${REGISTRY_ORGS}"

      - name: Verify Publication
        run: |
          set -e

          VERSION="${{ steps.version.outputs.version }}"
          PROVIDER_NAME="${{ github.event.repository.name }}"
          REGISTRY_PATH="${REGISTRY_ORGS}/${PROVIDER_NAME}"

          echo "Verifying container image publication..."
          echo "Registry: ${REGISTRY_PATH}"

          if docker pull "${REGISTRY_PATH}:${VERSION}" > /dev/null 2>&1; then
            DIGEST=$(docker inspect "${REGISTRY_PATH}:${VERSION}" --format='{{index .RepoDigests 0}}' | cut -d'@' -f2)
            echo "✅ Verified container image ${VERSION}"
            echo "   Digest: ${DIGEST}"
          else
            echo "⚠️  Could not verify container image (may still be building)"
          fi

          if docker pull "${REGISTRY_PATH}:latest" > /dev/null 2>&1; then
            echo "✅ Latest tag verified"
          else
            echo "⚠️  Could not verify latest tag"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ github.event.repository.name }} ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
